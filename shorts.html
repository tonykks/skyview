<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tony's SkyView Portfolio - 9:16 Shorts</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />

<!-- Preload images -->
<link rel="preload" as="image" href="./images/songak.png">
<link rel="preload" as="image" href="./images/sanbangsan.png">
<link rel="preload" as="image" href="./images/baksu.png">
<link rel="preload" as="image" href="./images/tiger.png">
<link rel="preload" as="image" href="./images/sup.png">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { dark: '#1f3556', DEFAULT: '#2b5aa6', hover: '#234b8b' },
          accent: '#7b1fa2', page: '#f2f2f2', card: '#ffffff', muted: '#6b7280'
        },
        fontFamily: { sans: ['Pretendard', 'sans-serif'] }
      }
    }
  }
</script>
</head>
<body>
  <header class="hero">
    <div id="slider-track" class="hero__track slider-transition"></div>
    <div class="hero__overlay"></div>
    <h1 class="hero__title text-shadow">Tony's Sky View</h1>
  </header>

  <!-- Navigation (Updated) -->
  <div class="navbar-wrapper">
    <div class="navbar nav">
      <a href="index.html" class="nav-btn nav__link">Home</a>
      <button id="places-toggle-btn" class="nav-btn nav__link" onclick="togglePlacesMenu()">Places ▼</button>
      <a href="videos.html" class="nav-btn nav__link">Videos</a>
      <a href="shorts.html" class="nav-btn nav__link">Shorts</a>
      <a href="https://smile21c.notion.site/my-profile" class="nav-btn nav__link" target="_blank" rel="noopener">About Me</a>
      <button id="contact-btn" class="nav-btn nav__link">Email Me</button>
    </div>
    <div id="sub-navbar-container" class="sub-navbar-container">
      <div id="sub-navbar-content" class="sub-navbar">
        <span class="subnav__placeholder">Loading places...</span>
      </div>
    </div>
  </div>

  <div class="intro">자유와 행복이 중요한 이유는 그것들이 삶(생존)의 질(質)을 좋게 하고, 양질의 삶을 증가시키기 때문이다.</div>
  <hr class="border-t-2 border-gray-300 my-8 w-4/5 mx-auto">
  <div id="shorts" class="text-center py-6">
    <h2 class="video-section-title">9:16 Shorts</h2>
    <div id="loading" class="text-gray-500 mb-4 font-bold">Loading shorts...</div>
    <div id="shorts-container" class="grid-layout grid grid--shorts grid--shorts-6"></div>
  </div>
  
  <div id="contact-modal" class="modal" aria-hidden="true">
    <div class="modal-content modal__content">
      <h3 class="text-xl font-bold mb-4">Contact Information</h3>
      <p class="text-gray-700 mb-6 text-muted">Email: smile21c@korea.com</p>
      <button id="close-modal-btn" class="btn btn--primary">Close</button>
    </div>
  </div>
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <div class="lightbox-inner lightbox__inner">
      <button class="lb-close lightbox__close" id="lb-close" aria-label="Close video">Close ✕</button>
      <div id="lb-target"></div>
    </div>
  </div>

<script>
  
    // ✅ Safe Storage (Edge/Private/확장프로그램/설정 차단 대비)
    // - localStorage 접근이 막히면 메모리 캐시로 graceful fallback
    const SafeStorage = (() => {
      const mem = Object.create(null);
      const hasLS = () => {
        try {
          const t = '__test__';
          localStorage.setItem(t, '1');
          localStorage.removeItem(t);
          return true;
        } catch (e) {
          return false;
        }
      };
      const ok = hasLS();

      return {
        get(key) {
          try {
            if (ok) return localStorage.getItem(key);
          } catch (e) {
            console.warn('[SafeStorage.get] blocked:', key, e);
          }
          return mem[key] ?? null;
        },
        set(key, value) {
          try {
            if (ok) {
              localStorage.setItem(key, value);
              return true;
            }
          } catch (e) {
            console.warn('[SafeStorage.set] blocked:', key, e);
          }
          mem[key] = value;
          return true;
        },
        remove(key) {
          try {
            if (ok) {
              localStorage.removeItem(key);
              return true;
            }
          } catch (e) {}
          delete mem[key];
          return true;
        }
      };
    })();

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdmO5YEMjTvrArVSmqyN0em4IQOzhOSfjf3mWBqlxA_qlht4Hf0udgJJA5uVQrsmmTPQ/exec"; 
  const BANNER_IMAGES = ["./images/songak.png", "./images/sanbangsan.png", "./images/baksu.png", "./images/tiger.png", "./images/sup.png"];
  
  // Banner
  document.addEventListener('DOMContentLoaded', () => {
    const track = document.getElementById('slider-track');
    if (!track) return;
    const imagesToUse = (BANNER_IMAGES && BANNER_IMAGES.length > 0) ? BANNER_IMAGES : [];
    if (imagesToUse.length === 0) return;
    const imagesToRender = [...imagesToUse, imagesToUse[0]];
    const totalSlides = imagesToUse.length;
    const slidesWithClone = imagesToRender.length;
    const slideWidthPercent = 100 / slidesWithClone;
    track.innerHTML = imagesToRender.map((src, i) => `<img src="${src}" class="hero__img banner-img" alt="Banner ${i}" style="width: ${slideWidthPercent}%;" onerror="this.onerror=null; this.src='https://placehold.co/1920x1080/CCCCCC/666666?text=Image+Loading...';">`).join('');
    track.style.width = `${slidesWithClone * 100}%`;
    const durationMs = 1000; const intervalMs = 10000; let index = 0; let timer = null;
    function goTo(i, withTransition = true) { track.style.transition = withTransition ? `transform ${durationMs}ms ease-in-out` : 'none'; track.style.transform = `translateX(-${i * slideWidthPercent}%)`; }
    function scheduleNext() { clearTimeout(timer); timer = setTimeout(nextSlide, intervalMs); }
    function nextSlide() { index += 1; goTo(index, true); if (index === totalSlides) { const onEnd = (e) => { if (e.propertyName !== 'transform') return; track.removeEventListener('transitionend', onEnd); index = 0; goTo(index, false); requestAnimationFrame(() => { requestAnimationFrame(() => { track.style.transition = `transform ${durationMs}ms ease-in-out`; }); }); scheduleNext(); }; track.addEventListener('transitionend', onEnd); } else { scheduleNext(); } }
    goTo(0, false); scheduleNext();
    document.addEventListener('visibilitychange', () => { if (document.hidden) clearTimeout(timer); else scheduleNext(); });
    loadPlacesForNav();
  });

  // Nav Logic
  function togglePlacesMenu() {
    const container = document.getElementById('sub-navbar-container');
    container.style.maxHeight = (container.style.maxHeight && container.style.maxHeight !== '0px') ? '0px' : '200px';
  }
  async function loadPlacesForNav() {
    const container = document.getElementById('sub-navbar-content');
    try {
      let places = [];
      const cached = SafeStorage.get('skyview_places');
      if (cached) { places = JSON.parse(cached); } else {
        const res = await fetch(SCRIPT_URL);
        const json = await res.json();
        if (!Array.isArray(json) && json.places) {
          places = json.places;
          SafeStorage.set('skyview_places', JSON.stringify(places));
        }
      }
      if (!places || places.length === 0) { container.innerHTML = "<span class='subnav__placeholder subnav__placeholder--error'>메뉴 로드 실패</span>"; return; }
      const topPlaces = places.filter(p => p.priority >= 1 && p.priority <= 7).sort((a,b) => a.priority - b.priority);
      container.innerHTML = '';
      topPlaces.forEach(p => { const a = document.createElement('a'); a.className = 'sub-btn subnav__link'; a.innerText = p.name; a.href = `places.html?place=${encodeURIComponent(p.name)}`; container.appendChild(a); });
      const allBtn = document.createElement('a'); allBtn.className = 'sub-btn subnav__link subnav__link--all'; allBtn.innerText = '전체보기'; allBtn.href = 'total_navi.html'; container.appendChild(allBtn);
    } catch (e) { console.warn("Nav load failed", e); }
  }

  function getId(url){ if(!url) return null; try{ const u = new URL(url); const v = u.searchParams.get('v'); if (v && v.length === 11) return v; const parts = u.pathname.split('/'); for (let i = parts.length - 1; i >= 0; i--) { const seg = parts[i]; if (seg && seg.length === 11) return seg; } }catch(e){ const m = url.match(/(?:watch\?v=|youtu\.be\/|embed\/|v\/)([A-Za-z0-9_-]{11})/); if (m) return m[1]; } return null; }
  const lb = document.getElementById('lightbox'); const lbClose = document.getElementById('lb-close'); const lbTarget = document.getElementById('lb-target');
  function openLB(id){ 
    lbTarget.innerHTML = `<iframe title="YouTube video player" style="width: min(90vw, 450px); aspect-ratio: 9/16; border:0; border-radius:12px;" src="https://www.youtube.com/embed/${id}?autoplay=1&mute=0&playsinline=1" allow="autoplay; encrypted-media" allowfullscreen></iframe>`; 
    lb.style.display='flex'; 
    lb.setAttribute('aria-hidden','false'); 
  }
  function closeLB(){ lb.style.display='none'; lb.setAttribute('aria-hidden','true'); lbTarget.innerHTML=''; }
  lbClose.addEventListener('click', closeLB); lb.addEventListener('click', e=>{ if(e.target===lb) closeLB(); }); window.addEventListener('keydown', e=>{ if(e.key==='Escape') closeLB(); });

  function render(list, containerId){ const el=document.getElementById(containerId); const loadingEl = document.getElementById('loading'); if(!el) return; if(loadingEl) loadingEl.style.display = 'none'; el.innerHTML = ''; 
    list.sort((a,b)=> new Date(b.date)-new Date(a.date));
    list.forEach(v=>{
      const id=getId(v.url); if(!id) return;
      if (v.type && v.type.toLowerCase() !== 'shorts') return;
      const card=document.createElement('div'); card.className='video-card card card--short'; card.setAttribute('role','button'); card.tabIndex=0;
      card.innerHTML=`<a class="thumb card__thumb card__thumb--9x16"><img loading="lazy" src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="${v.title} 썸네일"><span class="play card__badge">Play</span></a><div class="yt card__body"><a class="card__action" href="${v.url}" target="_blank" rel="noopener">[유튜브 바로가기]</a></div>`;
      const act=(e)=>{ const isYt = e.target.closest('.yt'); if(!isYt){ openLB(id); } };
      card.addEventListener('click', act); card.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openLB(id); } }); el.appendChild(card);
    });
  }
  async function loadShorts() {
    const loadingEl = document.getElementById('loading');
    try {
      const response = await fetch(SCRIPT_URL);
      if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
      const json = await response.json();
      const allVideos = json.videos || [];
      if(!allVideos || allVideos.length === 0) { if(loadingEl) loadingEl.textContent = 'No shorts found.'; return; }
      render(allVideos, 'shorts-container');
    } catch (error) { console.error('Fetch error:', error); if(loadingEl) { loadingEl.textContent = 'Failed to load shorts.'; loadingEl.style.color = '#ef4444'; } }
  }
  loadShorts();

  const contactBtn=document.getElementById('contact-btn'); const contactModal=document.getElementById('contact-modal'); const closeModalBtn=document.getElementById('close-modal-btn');
  if(contactBtn && contactModal && closeModalBtn){
    contactBtn.addEventListener('click',e=>{ e.preventDefault(); contactModal.style.display='flex'; contactModal.setAttribute('aria-hidden','false'); });
    closeModalBtn.addEventListener('click',()=>{ contactModal.style.display='none'; contactModal.setAttribute('aria-hidden','true'); });
    contactModal.addEventListener('click',e=>{ if(e.target===contactModal){ contactModal.style.display='none'; contactModal.setAttribute('aria-hidden','true'); } });
  }
  document.addEventListener('click', (e)=>{ const link = e.target.closest('.yt a'); if(!link) return; e.preventDefault(); const url = link.href; const w = window.screen.width, h = window.screen.height; const win = window.open(url, '_blank', `scrollbars=yes,width=${w},height=${h},top=0,left=0`); if(win && win.focus) win.focus(); });
</script>
</body>
</html>
