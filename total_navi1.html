<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>지도 좌표 확인</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .coordinate-panel {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #cfcfcf;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      line-height: 1.5;
    }

    .coordinate-panel strong {
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="coordinate-panel" id="coordinate-panel">
    <strong>지도 클릭 좌표</strong>
    지도를 좌클릭하면 위도와 경도가 표시됩니다.
  </div>
  <div id="map" aria-label="지도"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map("map").setView([33.3617, 126.5292], 10);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    const panel = document.getElementById("coordinate-panel");
    let marker = null;

    map.on("click", (event) => {
      const { lat, lng } = event.latlng;
      const latitude = lat.toFixed(6);
      const longitude = lng.toFixed(6);

      panel.innerHTML = `
        <strong>지도 클릭 좌표</strong>
        Latitude: ${latitude}<br />
        Longitude: ${longitude}
      `;

      if (marker) {
        marker.setLatLng(event.latlng);
      } else {
        marker = L.marker(event.latlng).addTo(map);
      }

      marker
        .bindPopup(`Latitude: ${latitude}<br>Longitude: ${longitude}`)
        .openPopup();
    });
  </script>
</body>
</html>
