<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tony's SkyView - Places</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { dark: '#1f3556', DEFAULT: '#2b5aa6', hover: '#234b8b' },
          accent: '#7b1fa2', page: '#f2f2f2', card: '#ffffff', muted: '#6b7280'
        },
        fontFamily: { sans: ['Pretendard', 'sans-serif'] }
      }
    }
  }
</script>

<style>
  body{ font-family:'Pretendard', sans-serif; background:var(--page-bg); color:#111827; }
  
  /* --- Navigation --- */
  .navbar-container { position: relative; background-color: #1f3556; z-index: 50; }
  .navbar { display: flex; justify-content: center; padding: 10px 0; align-items: center; }
  .nav-btn {
    background-color: #2b5aa6; color: #fff; padding: 10px 20px; margin: 0 5px; border-radius: 8px;
    text-decoration: none; font-size: 14px; min-width: 100px; text-align: center; display: inline-block;
    transition: background-color .25s ease; cursor: pointer; border: none; height: 40px; line-height: 20px;
  }
  .nav-btn:hover, .nav-btn.active { background-color: #234b8b; }
  
  /* Sub-Navbar (Hidden by default) */
  .sub-navbar {
    display: none; 
    position: absolute; top: 100%; left: 0; width: 100%;
    background-color: #234b8b; padding: 10px 0;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    justify-content: center; gap: 8px; flex-wrap: wrap; z-index: 40;
  }
  /* Show sub-navbar when hovering over parent container or itself */
  .nav-item-places:hover .sub-navbar, .sub-navbar:hover { display: flex; }

  .sub-btn {
    background: rgba(255,255,255,0.1); color: white; 
    padding: 8px 0; 
    width: 100px; /* 고정 길이 */
    border-radius: 4px; font-size: 13px; text-align: center;
    text-decoration: none; transition: all 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub-btn:hover { background: rgba(255,255,255,0.3); font-weight: bold; }
  .sub-btn.view-all { background: #7b1fa2; border: 1px solid rgba(255,255,255,0.2); }

  /* --- Mixed Grid Layout (Flex) --- */
  .mixed-container {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 24px; padding: 20px;
    max-width: 1400px; margin: 0 auto;
  }

  /* --- Card Styles (From videos.html & shorts.html) --- */
  .video-card { background: #fff; border-radius: 14px; overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.08); transition: transform .25s ease, box-shadow .25s ease; position: relative; }
  .video-card:hover { transform: translateY(-6px); box-shadow: 0 10px 24px rgba(0,0,0,.15); }
  
  /* Landscape Style (16:9) */
  .card-land { width: 300px; max-width: 100%; }
  .thumb-land { aspect-ratio: 16/9; background: #000; display: block; position: relative; cursor: pointer; }
  
  /* Shorts Style (9:16) */
  .card-short { width: 170px; max-width: 45vw; }
  .thumb-short { aspect-ratio: 9/16; background: #000; display: block; position: relative; cursor: pointer; }

  .thumb-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .play-badge { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 5px 9px; border-radius: 999px; pointer-events: none;}
  
  .yt-link { text-align: center; padding: 10px; }
  .yt-link a { color: #7b1fa2; font-size: 0.85rem; text-decoration: none; }
  .yt-link a:hover { text-decoration: underline; }

  /* --- Header Area --- */
  .place-header { text-align: center; margin: 40px 0 20px; }
  .place-title-link { 
    font-size: 2.5rem; font-weight: 800; color: #1f3556; text-decoration: none; 
    border-bottom: 3px solid transparent; transition: all 0.3s;
    cursor: pointer;
  }
  .place-title-link:hover { border-color: #2b5aa6; color: #2b5aa6; }
  
  /* Lightbox */
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 2000; }
  .lb-content { position: relative; width: 100%; display: flex; justify-content: center;}
  .lb-close { position: absolute; top: 20px; right: 20px; color: white; font-size: 30px; cursor: pointer; z-index: 2100; background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 8px;}
</style>
</head>
<body>

  <!-- Navigation -->
  <div class="navbar-container">
    <div class="navbar">
      <a href="index.html" class="nav-btn">Home</a>
      
      <!-- Places Dropdown Wrapper (Moved to 2nd Position) -->
      <div class="nav-item-places relative h-full">
        <a href="places.html" class="nav-btn active flex items-center justify-center">Places</a>
        <!-- Sub Navbar -->
        <div id="sub-nav" class="sub-navbar">
          <!-- JS will inject buttons here -->
          <div class="text-white text-xs">Loading...</div>
        </div>
      </div>

      <a href="videos.html" class="nav-btn">Videos</a>
      <a href="shorts.html" class="nav-btn">Shorts</a>
      <a href="https://smile21c.notion.site/my-profile" class="nav-btn" target="_blank">About Me</a>
    </div>
  </div>

  <!-- Content Area -->
  <div id="loading" class="text-center text-gray-500 font-bold my-10">데이터를 불러오는 중...</div>

  <div id="main-content" style="display:none;">
    <!-- Place Header -->
    <div class="place-header">
      <a id="place-link" href="#" target="_blank" class="place-title-link">
        <span id="place-name-display"></span>
      </a>
      <p class="text-gray-500 mt-2 text-sm">위 타이틀을 클릭하면 소개 페이지로 이동합니다</p>
    </div>

    <hr class="border-t-2 border-gray-300 w-4/5 mx-auto mb-8">

    <!-- Video Grid -->
    <div id="video-container" class="mixed-container"></div>
  </div>

  <!-- Lightbox -->
  <div id="lightbox" class="lightbox">
    <div class="lb-close" onclick="closeLightbox()">✕</div>
    <div id="lb-player" class="lb-content"></div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdmO5YEMjTvrArVSmqyN0em4IQOzhOSfjf3mWBqlxA_qlht4Hf0udgJJA5uVQrsmmTPQ/exec";

  let g_videos = [];
  let g_places = [];

  // 1. 초기화 및 데이터 로드
  async function init() {
    const loadingEl = document.getElementById('loading');
    try {
      const res = await fetch(SCRIPT_URL);
      const json = await res.json();
      
      // [중요] 구버전(배열)과 신버전(객체) 모두 대응하도록 처리
      if (Array.isArray(json)) {
        // 만약 Code.gs가 업데이트되지 않아 배열이 온 경우 (videos 데이터만 있다고 가정)
        g_videos = json;
        g_places = []; // 장소 메타데이터 없음
        console.warn("서버에서 구버전 데이터(배열)가 수신되었습니다. Code.gs 배포를 확인해주세요.");
      } else {
        // 정상적인 신버전 객체 수신
        g_videos = json.videos || [];
        g_places = json.places || [];
      }

      // 서브 네비게이션 렌더링 (데이터가 없으면 기본값 표시)
      renderSubNav();
      
      // URL 파라미터 확인 (예: places.html?place=범섬)
      const params = new URLSearchParams(window.location.search);
      let targetPlace = params.get('place');
      
      // 한글 깨짐 방지 디코딩
      if(targetPlace) targetPlace = decodeURIComponent(targetPlace);

      loadingEl.style.display = 'none';

      if (targetPlace) {
        loadPlaceContent(targetPlace);
      } else {
        // 장소가 지정되지 않았다면 첫 번째 우선순위 장소 또는 안내 메시지
        // 우선순위가 있는 장소 중 1번 찾기, 없으면 아무거나
        const first = g_places.find(p => p.priority <= 7) || g_places[0];
        
        if(first) {
          loadPlaceContent(first.name);
        } else {
          // 데이터가 아예 없을 경우 (Code.gs 배포 문제 등)
          if (g_videos.length > 0) {
             // 영상은 있는데 장소 메타데이터가 없는 경우 -> 영상의 'place' 속성으로라도 목록 생성 시도
             const uniquePlaces = [...new Set(g_videos.map(v => v.place).filter(Boolean))];
             if(uniquePlaces.length > 0) loadPlaceContent(uniquePlaces[0]);
             else showEmptyState();
          } else {
             showEmptyState();
          }
        }
      }
      
      document.getElementById('main-content').style.display = 'block';

    } catch (e) {
      console.error(e);
      loadingEl.innerHTML = `<div style="color:red">데이터 로딩 오류: ${e.message}<br>Code.gs 최신 버전 배포 여부를 확인해주세요.</div>`;
    }
  }

  function showEmptyState() {
    document.getElementById('place-name-display').innerText = "장소 선택";
    document.getElementById('video-container').innerHTML = "<div class='text-center mt-10'>표시할 데이터가 없습니다.</div>";
  }

  // 2. 서브 네비게이션 렌더링 (가로바)
  function renderSubNav() {
    const container = document.getElementById('sub-nav');
    container.innerHTML = '';

    // 우선순위 1~7 필터링 및 정렬
    // 메타데이터(g_places)가 없으면 영상 데이터(g_videos)에서 추출하여 임시 버튼 생성
    let topPlaces = [];
    
    if (g_places.length > 0) {
      topPlaces = g_places
        .filter(p => p.priority >= 1 && p.priority <= 7)
        .sort((a,b) => a.priority - b.priority);
    } else {
      // Fallback: 영상 데이터에서 장소 추출 (최대 7개)
      const unique = [...new Set(g_videos.map(v => v.place).filter(p => p && p !== '기타'))];
      topPlaces = unique.slice(0, 7).map(name => ({ name, priority: 99 }));
    }

    if(topPlaces.length === 0) {
      container.innerHTML = "<span class='text-white text-xs'>장소 정보 없음</span>";
    }

    // 버튼 생성
    topPlaces.forEach(p => {
      const btn = document.createElement('a');
      btn.className = 'sub-btn';
      btn.innerText = p.name;
      // 클릭 시 페이지 리로드 없이 콘텐츠 교체 (SPA 느낌) 또는 링크 이동
      btn.href = `places.html?place=${encodeURIComponent(p.name)}`;
      container.appendChild(btn);
    });

    // 전체보기 버튼 추가
    const allBtn = document.createElement('a');
    allBtn.className = 'sub-btn view-all';
    allBtn.innerText = '전체보기';
    allBtn.href = 'total_navi.html';
    container.appendChild(allBtn);
  }

  // 3. 메인 콘텐츠 로드 (장소별)
  function loadPlaceContent(placeName) {
    const displayEl = document.getElementById('place-name-display');
    const linkEl = document.getElementById('place-link');
    const container = document.getElementById('video-container');

    // 3-1. 헤더 설정
    displayEl.innerText = `장소명: ${placeName}`;
    
    // 메타데이터에서 링크 찾기
    const meta = g_places.find(p => p.name === placeName);
    if (meta && meta.introUrl) {
      linkEl.href = meta.introUrl;
      linkEl.style.pointerEvents = "auto";
      linkEl.title = "소개 페이지로 이동";
      linkEl.classList.remove('cursor-default');
    } else {
      linkEl.removeAttribute('href');
      linkEl.style.pointerEvents = "none";
      linkEl.title = "링크가 없습니다";
      linkEl.classList.add('cursor-default');
    }

    // 3-2. 영상 필터링
    // placeName과 일치하는 영상 필터링 (공백 제거 후 비교)
    const filtered = g_videos.filter(v => (v.place || "").trim() === placeName.trim());
    
    container.innerHTML = '';
    
    if (filtered.length === 0) {
      container.innerHTML = '<div class="w-full text-center text-gray-500 py-10">이 장소에 등록된 영상이 아직 없습니다.</div>';
      return;
    }

    // 최신순 정렬
    filtered.sort((a,b) => new Date(b.date) - new Date(a.date));

    // 3-3. 카드 렌더링 (Hybrid)
    filtered.forEach(v => {
      const isShorts = (v.type && v.type.toLowerCase() === 'shorts');
      const videoId = getId(v.url);
      if(!videoId) return;

      const card = document.createElement('div');
      // 타입에 따라 클래스 분기
      card.className = `video-card ${isShorts ? 'card-short' : 'card-land'}`;
      
      const thumbClass = isShorts ? 'thumb-short' : 'thumb-land';
      
      card.innerHTML = `
        <a class="${thumbClass}" onclick="openLightbox('${videoId}', ${isShorts})">
          <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" class="thumb-img" loading="lazy" alt="${v.title}">
          <span class="play-badge">Play</span>
        </a>
        <div class="yt-link">
          <a href="${v.url}" target="_blank">[유튜브 바로가기]</a>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // --- 유틸리티 ---
  function getId(url){
    if(!url) return null;
    const m = url.match(/(?:watch\?v=|youtu\.be\/|embed\/|v\/|shorts\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function openLightbox(id, isShorts) {
    const lb = document.getElementById('lightbox');
    const player = document.getElementById('lb-player');
    
    // 반응형 사이즈 계산
    // Shorts: PC에서는 폰화면처럼 좁게, 모바일에서는 꽉 차게
    // Landscape: PC에서는 크게, 모바일에서는 꽉 차게
    
    const style = isShorts 
      ? "width: min(90vw, 450px); aspect-ratio: 9/16;" 
      : "width: min(90vw, 1000px); aspect-ratio: 16/9;";

    player.innerHTML = `
      <iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=0" 
        style="${style} border:0; border-radius:12px;" 
        allow="autoplay; encrypted-media" allowfullscreen>
      </iframe>
    `;
    lb.style.display = 'flex';
  }

  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
    document.getElementById('lb-player').innerHTML = '';
  }

  // 실행
  init();

</script>
</body>
</html>
