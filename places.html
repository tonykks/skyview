<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tony's SkyView - Places</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

<link rel="preload" as="image" href="./images/songak.png">
<link rel="preload" as="image" href="./images/sanbangsan.png">
<link rel="preload" as="image" href="./images/baksu.png">
<link rel="preload" as="image" href="./images/tiger.png">
<link rel="preload" as="image" href="./images/sup.png">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { dark: '#1f3556', DEFAULT: '#2b5aa6', hover: '#234b8b' },
          accent: '#7b1fa2', page: '#f2f2f2', card: '#ffffff', muted: '#6b7280'
        },
        fontFamily: { sans: ['Pretendard', 'sans-serif'] }
      }
    }
  }
</script>
</head>
<body>

  <header class="hero">
    <div id="slider-track" class="hero__track slider-transition"></div>
    <div class="hero__overlay"></div>
    <h1 class="hero__title text-shadow">Tony's Sky View</h1>
  </header>

  <!-- Navigation -->
  <div class="navbar-wrapper">
    <div class="navbar nav">
      <a href="index.html" class="nav-btn nav__link">Home</a>
      <button id="places-toggle-btn" class="nav-btn nav__link active" onclick="togglePlacesMenu()">Places ▼</button>
      <a href="videos.html" class="nav-btn nav__link">Videos</a>
      <a href="shorts.html" class="nav-btn nav__link">Shorts</a>
      <a href="https://smile21c.notion.site/my-profile" class="nav-btn nav__link" target="_blank" rel="noopener">About Me</a>
      <button id="contact-btn" class="nav-btn nav__link">Email Me</button>
    </div>
    <div id="sub-navbar-container" class="sub-navbar-container">
      <div id="sub-navbar-content" class="sub-navbar">
        <span class="subnav__placeholder">Loading places...</span>
      </div>
    </div>
  </div>

  <div id="loading" class="text-center text-gray-500 font-bold my-10">데이터를 불러오는 중...</div>
  <div id="main-content" style="display:none;">
    <div class="place-header">
      <a id="place-link" href="#" target="_blank" class="place-title-link"><span id="place-name-display"></span></a>
      <div class="mt-4 flex justify-center gap-3">
        <button id="location-btn" type="button" class="btn btn--primary" style="padding:0.6rem 1.1rem; border-radius:12px;">위치</button>
      </div>
      <p class="text-gray-500 text-muted mt-3 text-sm">위 타이틀을 클릭하면 소개 페이지로 이동합니다</p>
    </div>
    <hr class="border-t-2 border-gray-300 w-4/5 mx-auto mb-8">
    <div id="video-container" class="mixed-container grid--flex"></div>
  </div>
  

  <!-- Map Modal (single-place location) -->
  <div id="map-modal" class="modal" aria-hidden="true" style="display:none;">
    <div class="modal-content modal__content" style="max-width: 1000px; width: min(92vw, 1000px);">
      <div class="flex items-start justify-between gap-3">
        <div>
          <h3 class="text-xl font-bold mb-1">제주도 위치 안내</h3>
          <p id="map-modal-subtitle" class="text-gray-600 text-sm text-muted">좌표 로딩 중...</p>
        </div>
        <button id="close-map-btn" class="btn btn--primary" type="button">Close ×</button>
      </div>
      <div id="map-container" class="mt-4 rounded-xl overflow-hidden border border-gray-200 dark:border-slate-700" style="height: min(70vh, 560px); width: 100%;"></div>
      <p class="text-gray-500 text-xs text-muted mt-3">※ 지도는 OpenStreetMap 기반이며, API Key/카드 등록 없이 표시됩니다.</p>
    </div>
  </div>

  <div id="contact-modal" class="modal" aria-hidden="true">
    <div class="modal-content modal__content">
      <h3 class="text-xl font-bold mb-4">Contact Information</h3>
      <p class="text-gray-700 mb-6 text-muted">Email: smile21c@korea.com</p>
      <button id="close-modal-btn" class="btn btn--primary">Close ×</button>
    </div>
  </div>
  <div id="lightbox" class="lightbox">
    <button class="lb-close lightbox__close" onclick="closeLightbox()" aria-label="Close">Close ×</button>
    <div id="lb-player" class="lb-content"></div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdmO5YEMjTvrArVSmqyN0em4IQOzhOSfjf3mWBqlxA_qlht4Hf0udgJJA5uVQrsmmTPQ/exec";
  const BANNER_IMAGES = ["./images/songak.png", "./images/sanbangsan.png", "./images/baksu.png", "./images/tiger.png", "./images/sup.png"];

  let g_videos = []; let g_places = [];
  let g_map = null;
  let g_mapMarker = null;

  function toNumber(v) {
    if (v === null || v === undefined) return NaN;
    const n = (typeof v === 'string') ? Number(v.trim()) : Number(v);
    return n;
  }

  function getLng(obj) {
    // Support common variants: lng / Ing (sheet) / log / Lng / lon
    return obj?.lng ?? obj?.Ing ?? obj?.log ?? obj?.Lng ?? obj?.lon ?? obj?.longitude;
  }

  function openMapModal(placeName) {
    const meta = g_places.find(p => (p.name || p.place_name) === placeName);
    const lat = toNumber(meta?.lat);
    const lng = toNumber(getLng(meta));

    const modal = document.getElementById('map-modal');
    const subtitle = document.getElementById('map-modal-subtitle');
    const container = document.getElementById('map-container');

    modal.style.display = 'flex';

    if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
      subtitle.textContent = `${placeName}의 좌표(lat/lng)가 없습니다. 스프레드시트에 좌표를 추가해 주세요.`;
      container.innerHTML = '<div class="w-full h-full flex items-center justify-center text-gray-500">좌표 없음</div>';
      return;
    }

    subtitle.textContent = `${placeName} (${lat.toFixed(3)}, ${lng.toFixed(3)})`;

    // Init map once
    if (!g_map) {
      g_map = L.map(container, { scrollWheelZoom: true });

      // OSM tile: no API key / no billing
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(g_map);

      // Fix marker icon paths (CDN)
      L.Icon.Default.mergeOptions({
        iconRetinaUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
        iconUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
        shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png"
      });
    }

    // Ensure map sizes correctly after modal opens
    setTimeout(() => {
      g_map.invalidateSize();
      g_map.setView([lat, lng], 12);

      if (g_mapMarker) {
        g_mapMarker.setLatLng([lat, lng]);
      } else {
        g_mapMarker = L.marker([lat, lng]).addTo(g_map);
      }
      g_mapMarker.bindPopup(`<b>${placeName}</b>`).openPopup();
    }, 50);
  }

  function closeMapModal() {
    const modal = document.getElementById('map-modal');
    modal.style.display = 'none';
  }

  async function init() {
    const loadingEl = document.getElementById('loading');
    try {
      const res = await fetch(SCRIPT_URL);
      const json = await res.json();
      if (Array.isArray(json)) { g_videos = json; g_places = []; } else { g_videos = json.videos || []; g_places = json.places || []; }
      
    try {
          sessionStorage.setItem('skyview_places', JSON.stringify(g_places));
        } catch (e) {
          console.warn("Storage blocked; skip cache", e);
        }

      loadPlacesForNav(g_places); 

      const params = new URLSearchParams(window.location.search);
      let targetPlace = params.get('place');
      if(targetPlace) targetPlace = decodeURIComponent(targetPlace);
      loadingEl.style.display = 'none';
      if (targetPlace) { loadPlaceContent(targetPlace); } else {
        const first = g_places.find(p => p.priority <= 7) || g_places[0];
        if(first) { loadPlaceContent(first.name); } else {
          if (g_videos.length > 0) { const uniquePlaces = [...new Set(g_videos.map(v => v.place).filter(Boolean))]; if(uniquePlaces.length > 0) loadPlaceContent(uniquePlaces[0]); else showEmptyState(); } else { showEmptyState(); }
        }
      }
      document.getElementById('main-content').style.display = 'block';
    } catch (e) { console.error(e); loadingEl.innerHTML = `<div class="text-error">데이터 로딩 오류: ${e.message}</div>`; }
  }

  // Banner
  document.addEventListener('DOMContentLoaded', () => {
    const track = document.getElementById('slider-track');
    if (track) {
      const imagesToUse = (BANNER_IMAGES && BANNER_IMAGES.length > 0) ? BANNER_IMAGES : [];
      if (imagesToUse.length > 0) {
        const imagesToRender = [...imagesToUse, imagesToUse[0]];
        const slideWidthPercent = 100 / imagesToRender.length;
        track.innerHTML = imagesToRender.map((src, i) => `<img src="${src}" class="hero__img banner-img" style="width: ${slideWidthPercent}%;" onerror="this.onerror=null; this.src='https://placehold.co/1920x1080/CCCCCC/666666?text=Image+Loading...';">`).join('');
        track.style.width = `${imagesToRender.length * 100}%`;
        let index=0; setInterval(()=>{ index++; track.style.transition='transform 1s ease'; track.style.transform=`translateX(-${index*slideWidthPercent}%)`; if(index===imagesToUse.length){ setTimeout(()=>{ track.style.transition='none'; index=0; track.style.transform='translateX(0)'; },1000); } }, 10000);
      }
    }
  });

  // Nav Logic
  function togglePlacesMenu() { const c = document.getElementById('sub-navbar-container'); c.style.maxHeight = (c.style.maxHeight && c.style.maxHeight !== '0px') ? '0px' : '200px'; }
  function loadPlacesForNav(places) {
    const container = document.getElementById('sub-navbar-content');
    if (!places || places.length === 0) { container.innerHTML = "<span class='subnav__placeholder subnav__placeholder--error'>메뉴 로드 실패</span>"; return; }
    const topPlaces = places.filter(p => p.priority >= 1 && p.priority <= 7).sort((a,b) => a.priority - b.priority);
    container.innerHTML = '';
    topPlaces.forEach(p => { const a = document.createElement('a'); a.className = 'sub-btn subnav__link'; a.innerText = p.name; a.href = `places.html?place=${encodeURIComponent(p.name)}`; container.appendChild(a); });
    const allBtn = document.createElement('a'); allBtn.className = 'sub-btn subnav__link subnav__link--all'; allBtn.innerText = '전체보기'; allBtn.href = 'total_navi.html'; container.appendChild(allBtn);
  }

  function loadPlaceContent(placeName) {
    document.getElementById('place-name-display').innerText = `${placeName}`;
    const linkEl = document.getElementById('place-link');
    const meta = g_places.find(p => p.name === placeName);
    if (meta && meta.introUrl) { linkEl.href = meta.introUrl; linkEl.style.pointerEvents = "auto"; } else { linkEl.removeAttribute('href'); linkEl.style.pointerEvents = "none"; }

    // Location button (single-place popup map)
    if (locationBtn) {
      locationBtn.onclick = () => openMapModal(placeName);
      locationBtn.disabled = false; // always clickable; modal will explain if coords missing
      locationBtn.style.opacity = '1';
      locationBtn.style.cursor = 'pointer';
    }

    const container = document.getElementById('video-container');

    const filtered = g_videos.filter(v => (v.place || "").trim() === placeName.trim());
    container.innerHTML = '';
    if (filtered.length === 0) { container.innerHTML = '<div class="w-full text-center text-gray-500 py-10">등록된 영상 없음</div>'; return; }
    filtered.sort((a,b) => new Date(b.date) - new Date(a.date));
    
    filtered.forEach(v => {
      const isShorts = (v.type && v.type.toLowerCase() === 'shorts');
      const videoId = getId(v.url); if(!videoId) return;
      
      const card = document.createElement('div');
      card.className = `video-card card card--fixed-thumb ${isShorts ? 'card--short' : 'card--land'}`;
      
      // 제목이 없으면 '제목 없음' 처리
      const titleText = v.title || "제목 없음";
      
      card.innerHTML = `
        <div class="thumb-wrapper card__thumb" onclick="openLightbox('${videoId}', ${isShorts})">
          <img src="https://img.youtube.com/vi/${videoId}/hqdefault.jpg" class="thumb-img" loading="lazy" alt="${titleText}">
          <span class="play-badge card__badge">Play</span>
        </div>
        <div class="info-area card__body">
          <span class="video-title card__title" title="${titleText}">${titleText}</span>
          <a href="${v.url}" target="_blank" class="yt-link-btn card__action">[유튜브]</a>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function getId(url){ if(!url) return null; const m = url.match(/(?:watch\?v=|youtu\.be\/|embed\/|v\/|shorts\/)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; }
  function openLightbox(id, isShorts) {
    const lb = document.getElementById('lightbox'); const player = document.getElementById('lb-player');
    const style = isShorts ? "width: min(90vw, 450px); aspect-ratio: 9/16;" : "width: min(90vw, 1000px); aspect-ratio: 16/9;";
    player.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&mute=0" style="${style} border:0; border-radius:12px;" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
    lb.style.display = 'flex';
  }
  function closeLightbox() { document.getElementById('lightbox').style.display = 'none'; document.getElementById('lb-player').innerHTML = ''; }
  const contactBtn=document.getElementById('contact-btn'); const contactModal=document.getElementById('contact-modal'); const closeModalBtn=document.getElementById('close-modal-btn');

  const locationBtn = document.getElementById('location-btn');
  const closeMapBtn = document.getElementById('close-map-btn');
  if (closeMapBtn) closeMapBtn.addEventListener('click', closeMapModal);

  if(contactBtn){ contactBtn.addEventListener('click',e=>{ e.preventDefault(); contactModal.style.display='flex'; }); closeModalBtn.addEventListener('click',()=>{ contactModal.style.display='none'; }); }

  init();
</script>
</body>
</html>
