<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tony's SkyView - All Places</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<!-- Preload banner images -->
<link rel="preload" as="image" href="./images/songak.png">
<link rel="preload" as="image" href="./images/sanbangsan.png">
<link rel="preload" as="image" href="./images/baksu.png">
<link rel="preload" as="image" href="./images/tiger.png">
<link rel="preload" as="image" href="./images/sup.png">

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { dark: '#1f3556', DEFAULT: '#2b5aa6', hover: '#234b8b' },
          accent: '#7b1fa2', page: '#f2f2f2', card: '#ffffff', muted: '#6b7280'
        },
        fontFamily: { sans: ['Pretendard', 'sans-serif'] }
      }
    }
  }
</script>

<style>
  :root{ --brand-dark:#1f3556; --brand:#2b5aa6; --brand-hover:#234b8b; --accent:#7b1fa2; --card-bg:#ffffff; --page-bg:#f2f2f2; --text:#111827; --muted:#6b7280; }
  @media (prefers-color-scheme: dark){ :root{ --card-bg:#111827; --page-bg:#0b1220; --text:#e5e7eb; --muted:#9ca3af; --brand-dark:#162640; --brand:#2b5aa6; --brand-hover:#234b8b; --accent:#8b5cf6; } body { background-color: #0b1220; color: #e5e7eb; } }
  body{ font-family:'Pretendard', sans-serif; background:var(--page-bg); color:var(--text); line-height: 1.6; word-break: keep-all; }
  
  /* Banner & Slider */
  .slider-transition { transition: transform 1s ease-in-out; }
  .text-shadow { text-shadow: 2px 2px 4px rgba(0,0,0,.55); }

  /* Navbar (Consistent) */
  .navbar-wrapper { background: var(--brand-dark); width: 100%; }
  .navbar { display: flex; justify-content: center; padding: 10px 0; flex-wrap: wrap; gap: 5px; }
  .nav-btn {
    background: var(--brand); color: #fff; border: none; padding: 10px 20px; border-radius: 8px;
    text-decoration: none; font-size: 14px; transition: background .25s ease;
    min-width: 100px; text-align: center; display: inline-block; cursor: pointer;
  }
  .nav-btn:hover { background: var(--brand-hover); }

  /* Sub-Navbar (Expandable) */
  .sub-navbar-container {
    background-color: #162640; width: 100%; overflow: hidden; max-height: 0; transition: max-height 0.3s ease-out; border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .sub-navbar { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; padding: 10px 0; }
  .sub-btn { background: rgba(255,255,255,0.1); color: #ddd; padding: 6px 0; width: 90px; border-radius: 4px; font-size: 13px; text-align: center; text-decoration: none; transition: all 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub-btn:hover { background: rgba(255,255,255,0.25); color: #fff; }
  .sub-btn.view-all { background: #7b1fa2; color: white; }

  /* Content Styles */
  .container { max-width: 800px; margin: 40px auto; padding: 20px; text-align: center; }
  .index-btn {
    display: inline-block; margin: 8px; padding: 12px 24px;
    background: var(--card-bg); border: 1px solid #ddd; border-radius: 12px;
    color: var(--text); font-size: 16px; font-weight: 600; text-decoration: none;
    transition: all 0.2s; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
  }
  .index-btn:hover { transform: translateY(-3px); box-shadow: 0 5px 12px rgba(0,0,0,0.1); border-color: var(--brand); color: var(--brand); }

  /* Modal */
  .modal{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:1000; }
  .modal-content{ background:var(--card-bg); color:var(--text); padding:2rem; border-radius:.75rem; width:min(92vw,420px); text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.35); }
  
  @media (max-width:768px){ .header-title { font-size: 2.5rem !important; } }
</style>
</head>
<body>

  <!-- Banner Section (Added) -->
  <header class="relative w-full h-[320px] md:h-[480px] overflow-hidden bg-gray-900">
    <div id="slider-track" class="absolute inset-y-0 left-0 flex h-full slider-transition"></div>
    <div class="absolute inset-0 bg-black/20"></div>
    <h1 class="header-title absolute left-1/2 -translate-x-1/2 top-[50%] -translate-y-[50%] text-5xl md:text-7xl font-extrabold text-white text-shadow tracking-tight z-20 w-full text-center px-4">Tony's Sky View</h1>
  </header>

  <!-- Navigation (Updated to Unified Style) -->
  <div class="navbar-wrapper">
    <div class="navbar">
      <a href="index.html" class="nav-btn">Home</a>
      
      <!-- Places Trigger -->
      <button id="places-toggle-btn" class="nav-btn" onclick="togglePlacesMenu()">Places ▼</button>
      
      <a href="videos.html" class="nav-btn">Videos</a>
      <a href="shorts.html" class="nav-btn">Shorts</a>
      <a href="https://smile21c.notion.site/my-profile" class="nav-btn" target="_blank" rel="noopener">About Me</a>
      <button id="contact-btn" class="nav-btn">Contact Me</button>
    </div>
    
    <!-- Sub-Navbar (Expandable) -->
    <div id="sub-navbar-container" class="sub-navbar-container">
      <div id="sub-navbar-content" class="sub-navbar">
        <span style="color:#aaa; font-size:12px;">Loading places...</span>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container">
    <h2 class="text-3xl font-bold mb-2" style="color:var(--brand-dark)">모든 장소 보기</h2>
    <p class="mb-10" style="color:var(--muted)">가나다 순으로 정렬되어 있습니다</p>
    
    <div id="loading" class="text-gray-500 font-bold">Loading...</div>
    <div id="list-container"></div>
  </div>

  <!-- Contact Modal (Added) -->
  <div id="contact-modal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <h3 class="text-xl font-bold mb-4">Contact Information</h3>
      <p class="mb-6" style="color:var(--muted)">Email: smile21c@korea.com</p>
      <button id="close-modal-btn" class="nav-btn">Close</button>
    </div>
  </div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdmO5YEMjTvrArVSmqyN0em4IQOzhOSfjf3mWBqlxA_qlht4Hf0udgJJA5uVQrsmmTPQ/exec";
  const BANNER_IMAGES = ["./images/songak.png", "./images/sanbangsan.png", "./images/baksu.png", "./images/tiger.png", "./images/sup.png"];

  // 1. Banner Slider Logic
  document.addEventListener('DOMContentLoaded', () => {
    const track = document.getElementById('slider-track');
    if (track) {
      const imagesToUse = (BANNER_IMAGES && BANNER_IMAGES.length > 0) ? BANNER_IMAGES : [];
      if (imagesToUse.length > 0) {
        const imagesToRender = [...imagesToUse, imagesToUse[0]];
        const slideWidthPercent = 100 / imagesToRender.length;
        track.innerHTML = imagesToRender.map((src, i) => `<img src="${src}" class="h-full object-cover flex-shrink-0" style="width: ${slideWidthPercent}%;" onerror="this.onerror=null; this.src='https://placehold.co/1920x1080/CCCCCC/666666?text=Image+Loading...';">`).join('');
        track.style.width = `${imagesToRender.length * 100}%`;
        let index=0; 
        setInterval(()=>{ 
          index++; 
          track.style.transition='transform 1s ease'; 
          track.style.transform=`translateX(-${index*slideWidthPercent}%)`; 
          if(index===imagesToUse.length){ 
            setTimeout(()=>{ track.style.transition='none'; index=0; track.style.transform='translateX(0)'; },1000); 
          } 
        }, 10000);
      }
    }
    loadPlacesForNav(); // Load nav menu
    loadAllPlacesList(); // Load main content
  });

  // 2. Navbar & Menu Logic
  function togglePlacesMenu() {
    const container = document.getElementById('sub-navbar-container');
    container.style.maxHeight = (container.style.maxHeight && container.style.maxHeight !== '0px') ? '0px' : '200px';
  }

  async function loadPlacesForNav() {
    const container = document.getElementById('sub-navbar-content');
    try {
      let places = [];
      const cached = sessionStorage.getItem('skyview_places');
      if (cached) { places = JSON.parse(cached); } else {
        const res = await fetch(SCRIPT_URL);
        const json = await res.json();
        if (!Array.isArray(json) && json.places) {
          places = json.places;
          sessionStorage.setItem('skyview_places', JSON.stringify(places));
        }
      }
      if (!places || places.length === 0) { container.innerHTML = "<span style='color:#ccc; font-size:12px;'>메뉴 로드 실패</span>"; return; }
      
      const topPlaces = places.filter(p => p.priority >= 1 && p.priority <= 7).sort((a,b) => a.priority - b.priority);
      container.innerHTML = '';
      
      topPlaces.forEach(p => { 
        const a = document.createElement('a'); a.className = 'sub-btn'; a.innerText = p.name; 
        a.href = `places.html?place=${encodeURIComponent(p.name)}`; container.appendChild(a); 
      });
      
      const allBtn = document.createElement('a'); allBtn.className = 'sub-btn view-all'; allBtn.innerText = '전체보기'; 
      allBtn.href = 'total_navi.html'; container.appendChild(allBtn);

    } catch (e) { console.warn("Nav load failed", e); }
  }

  // 3. Main Content Logic (All Places List)
  async function loadAllPlacesList() {
    try {
      // Use cached data if available, otherwise fetch
      let places = [];
      const cached = sessionStorage.getItem('skyview_places');
      if (cached) {
        places = JSON.parse(cached);
      } else {
        const res = await fetch(SCRIPT_URL);
        const json = await res.json();
        places = json.places || [];
      }

      const names = [...new Set(places.map(p => p.name))].sort((a, b) => a.localeCompare(b));
      const container = document.getElementById('list-container');
      document.getElementById('loading').style.display = 'none';

      names.forEach(name => {
        const a = document.createElement('a');
        a.className = 'index-btn';
        a.innerText = name;
        a.href = `places.html?place=${encodeURIComponent(name)}`;
        container.appendChild(a);
      });

    } catch (e) {
      document.getElementById('loading').innerText = "로드 실패";
    }
  }

  // 4. Contact Modal Logic
  const contactBtn=document.getElementById('contact-btn');
  const contactModal=document.getElementById('contact-modal');
  const closeModalBtn=document.getElementById('close-modal-btn');
  
  if(contactBtn && contactModal && closeModalBtn){
    contactBtn.addEventListener('click',e=>{ e.preventDefault(); contactModal.style.display='flex'; });
    closeModalBtn.addEventListener('click',()=>{ contactModal.style.display='none'; });
    contactModal.addEventListener('click',e=>{ if(e.target===contactModal){ contactModal.style.display='none'; } });
  }
</script>
</body>
</html>
