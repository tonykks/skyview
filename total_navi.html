<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Tony's SkyView - All Places</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { dark: '#1f3556', DEFAULT: '#2b5aa6', hover: '#234b8b' },
          accent: '#7b1fa2', page: '#f2f2f2', card: '#ffffff', muted: '#6b7280'
        },
        fontFamily: { sans: ['Pretendard', 'sans-serif'] }
      }
    }
  }
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  #jeju-map { width: 100%; height: min(60vh, 520px); z-index: 10; border-radius: 0.75rem; }
  @media (max-width: 640px) { #jeju-map { height: 42vh; } }
  .leaflet-popup-content { font-family: 'Pretendard', sans-serif; font-weight: bold; text-align: center; }
</style>
</head>
<body>

  <header class="hero">
    <div id="slider-track" class="hero__track slider-transition"></div>
    <div class="hero__overlay"></div>
    <h1 class="hero__title text-shadow">Tony's Sky View</h1>
  </header>

  <div class="navbar-wrapper">
    <div class="navbar nav">
      <a href="index.html" class="nav-btn nav__link">Home</a>
      <button id="places-toggle-btn" class="nav-btn nav__link" onclick="togglePlacesMenu()">Places ▼</button>
      <a href="videos.html" class="nav-btn nav__link">Videos</a>
      <a href="shorts.html" class="nav-btn nav__link">Shorts</a>
      <a href="https://smile21c.notion.site/my-profile" class="nav-btn nav__link" target="_blank" rel="noopener">About Me</a>
      <button id="contact-btn" class="nav-btn nav__link">Email Me</button>
    </div>
    <div id="sub-navbar-container" class="sub-navbar-container">
      <div id="sub-navbar-content" class="sub-navbar">
        <span class="subnav__placeholder">Loading...</span>
      </div>
    </div>
  </div>

  <div class="intro text-sm md:text-lg">행복은 내가 좋아하는 것, 잘하는 것, 세상이 원하는 것의 교차점에 있다.</div>
  <hr class="border-t-2 border-gray-300 w-4/5 mx-auto mb-8">

  <div class="container mx-auto px-2 text-center">
    <h2 class="text-2xl md:text-3xl font-bold mb-2 text-brand-dark">모든 장소 보기</h2>
    <div id="loading" class="text-gray-500 font-bold my-10">데이터 정밀 동기화 중...</div>
    <div id="list-container" class="grid grid-cols-6 md:flex md:flex-wrap md:justify-center gap-1 md:gap-4 max-w-[1200px] mx-auto mb-12"></div>

    <div id="map-section" class="max-w-[1000px] mx-auto pb-20">
      <h3 class="text-xl font-bold mb-4 text-brand-dark">제주도 촬영 위치 안내</h3>
      <div class="relative overflow-hidden rounded-2xl shadow-lg border border-gray-200 bg-white p-2">
        <div id="jeju-map"></div>
      </div>
    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // ✅ 1. 마커 아이콘 에셋 경로 강제 해결
  delete L.Icon.Default.prototype._getIconUrl;
  L.Icon.Default.mergeOptions({
    iconRetinaUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon-2x.png",
    iconUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png",
    shadowUrl: "https://unpkg.com/leaflet@1.9.4/dist/images/marker-shadow.png"
  });

  // ✅ 2. 데이터 버전 관리 (캐시 무효화 핵심)
  const DATA_KEY = "skyview_data_v2024_01_30"; 

  const SafeStorage = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { return false; } }
  };

  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdmO5YEMjTvrArVSmqyN0em4IQOzhOSfjf3mWBqlxA_qlht4Hf0udgJJA5uVQrsmmTPQ/exec";

  async function loadData() {
    try {
      let data = null;
      const cached = SafeStorage.get(DATA_KEY);
      if (cached) {
        data = JSON.parse(cached);
        console.log("Cached data loaded.");
      } else {
        const res = await fetch(SCRIPT_URL);
        data = await res.json();
        SafeStorage.set(DATA_KEY, JSON.stringify(data));
        console.log("Fresh data fetched.");
      }

      const places = data.places || [];
      renderJejuMap(places); // 마커 렌더링 실행
      renderList(places);
    } catch (e) {
      document.getElementById('loading').innerText = "로드 실패: " + e.message;
    }
  }

  function renderJejuMap(places) {
    const el = document.getElementById('jeju-map');
    if (!el || typeof L === 'undefined') return;
    if (el._leaflet_id) { el.innerHTML = ''; el._leaflet_id = null; }

    // 지도 생성
    const map = L.map('jeju-map').setView([33.3617, 126.5292], 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    const bounds = [];
    let count = 0;

    places.forEach(p => {
      // ✅ 데이터 필드 유연하게 매핑 (p.lat, p.lng 확인)
      const lat = parseFloat(p.lat);
      const lng = parseFloat(p.lng || p.Ing || p.log);

      if (!isFinite(lat) || !isFinite(lng)) return;

      const name = (p.place_name ?? p.name ?? '이름 없음').toString();
      
      // ✅ CircleMarker에서 일반 Marker(핀)로 변경
      const marker = L.marker([lat, lng]).addTo(map);
      marker.bindPopup(`<b>${name}</b>`);
      marker.bindTooltip(name, { direction: 'top', offset: [0, -10] });

      bounds.push([lat, lng]);
      count++;
    });

    if (count >= 2) map.fitBounds(bounds, { padding: [50, 50] });
    else if (count === 1) map.setView(bounds[0], 12);
    
    console.log(`Map Rendered: ${count} markers placed.`);
  }

  function renderList(places) {
    document.getElementById('loading').style.display = 'none';
    const container = document.getElementById('list-container');
    const navContainer = document.getElementById('sub-navbar-content');
    
    navContainer.innerHTML = '';
    places.filter(p => p.priority >= 1 && p.priority <= 7).sort((a,b) => a.priority - b.priority).forEach(p => {
      const name = p.place_name || p.name;
      const a = document.createElement('a'); a.className = 'sub-btn subnav__link'; a.innerText = name;
      a.href = `places.html?place=${encodeURIComponent(name)}`; navContainer.appendChild(a);
    });

    let names = [...new Set(places.map(p => p.place_name || p.name))].sort((a, b) => a.localeCompare(b));
    container.innerHTML = '';
    names.forEach(name => {
      const a = document.createElement('a');
      a.className = 'flex items-center justify-center w-full md:w-[120px] min-h-[40px] rounded-lg shadow-sm border bg-white text-[10px] md:text-sm font-semibold hover:border-brand transition-all';
      a.innerText = name;
      a.href = `places.html?place=${encodeURIComponent(name)}`; 
      container.appendChild(a);
    });
  }

  function togglePlacesMenu() {
    const container = document.getElementById('sub-navbar-container');
    container.style.maxHeight = (container.style.maxHeight && container.style.maxHeight !== '0px') ? '0px' : '200px';
  }

  document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
